name: Send milestone pushes

# 관리자 완료 → 펫무브 앱 푸시. 10분마다 완료 마일스톤을 스캔해 FCM 발송한다.
# (이벤트형 즉시 발송이 아니라 폴링 — 인프라를 단순하게. 공개 저장소라 Actions 무제한 무료.
#  관리자 완료 후 최대 ~10분 내 도착. "거의 즉시"가 필요하면 webhook+발송서버 방식으로 전환.)
# 비밀은 기존 것 재사용(SUPABASE_DB_URL) + FCM_SERVICE_ACCOUNT(서비스 계정 키) 1개만 추가.

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *' # 매 10분 (GitHub 정각 혼잡 회피로 3분 오프셋)
  workflow_dispatch:

concurrency:
  group: send-milestone-pushes
  cancel-in-progress: false

jobs:
  send:
    name: Scan + send FCM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 실패 시 이슈를 만들어 알림 보내려면 issues 쓰기 권한 필요.
    permissions:
      contents: read
      issues: write
    steps:
      # 펫무브 앱 서버 워밍 — 10분마다 한 번 찔러 Vercel 함수 콜드 스타트(첫 실행 렉)를
      # 완화한다. 이 cron 에 얹혀 별도 워크플로 없이 공짜. 실패해도 푸시 발송엔 영향 X.
      - name: Warm portal
        run: curl -s -o /dev/null -m 10 https://app.petmove.co.kr/support || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Send
        run: pnpm tsx scripts/send-milestone-pushes.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}

      # 발송 작업이 실패하면 = 푸시가 안 나가는 중일 수 있음. 조용히 죽지 않도록 GitHub 이슈를
      # 만들어 알린다(이슈 생성 시 저장소 소유자에게 메일 발송). 같은 장애가 계속되면 새 이슈를
      # 만들지 않고 기존 'push-failure' 이슈에 댓글만 달아 도배를 막는다. 고친 뒤 이슈를 닫으면 됨.
      - name: 실패 알림 (GitHub 이슈)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              '🔴 **푸시 발송 작업이 실패했어요.** 지금 고객에게 알림이 안 나가는 중일 수 있어요.',
              '',
              `- 실패한 실행: ${runUrl}`,
              '- 흔한 원인: ① DB 비밀번호 변경(GitHub 비밀 `SUPABASE_DB_URL` 갱신 필요) ② Supabase 무료 프로젝트 일시정지 ③ FCM 키 문제',
              '',
              '고친 뒤 이 이슈를 **닫으세요**. (발송 로직은 catch-up 이라, 고치면 밀린 푸시가 다음 실행에 전부 나갑니다.)',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'push-failure' });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: '⚠️ 푸시 발송 작업 실패 — 확인 필요', labels: ['push-failure'], body });
            }
