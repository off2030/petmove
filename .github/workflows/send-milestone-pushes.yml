name: Send milestone pushes

# 관리자 완료 → 펫무브 앱 푸시. 10분마다 완료 마일스톤을 스캔해 FCM 발송한다.
# (이벤트형 즉시 발송이 아니라 폴링 — 인프라를 단순하게. 공개 저장소라 Actions 무제한 무료.
#  관리자 완료 후 최대 ~10분 내 도착. "거의 즉시"가 필요하면 webhook+발송서버 방식으로 전환.)
# 비밀은 기존 것 재사용(SUPABASE_DB_URL) + FCM_SERVICE_ACCOUNT(서비스 계정 키) 1개만 추가.

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *' # 매 10분 (GitHub 정각 혼잡 회피로 3분 오프셋)
  workflow_dispatch:

concurrency:
  group: send-milestone-pushes
  cancel-in-progress: false

jobs:
  send:
    name: Scan + send FCM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Send
        run: pnpm tsx scripts/send-milestone-pushes.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
