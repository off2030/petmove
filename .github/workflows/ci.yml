name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # turbo lint (eslint) + scripts/lint-rls.mjs 둘 다 항상 실행, max exit code 반환.
      # eslint 경고는 통과시키되 (warn level), error 면 fail.
      - name: Lint (eslint + RLS)
        run: pnpm lint

      - name: Typecheck admin
        run: pnpm --filter @petmove/admin exec tsc --noEmit

      - name: Check report list journey selection
        run: pnpm tsx scripts/check-import-report-selection.ts

      - name: Check co-owner names and certificate mappings
        run: pnpm tsx scripts/check-co-owner.ts

      - name: Check NZ importer and arrival port
        run: pnpm tsx scripts/check-nz-consignment.ts

      - name: Check NZ certificate missing-field warnings
        run: node scripts/check-nz-pdf-missing.mjs

      - name: Typecheck portal
        run: pnpm --filter @petmove/portal exec tsc --noEmit

      - name: Typecheck www
        run: pnpm --filter @petmove/www exec tsc --noEmit

      - name: Check deployment scopes and WWW shared dependencies
        run: node scripts/check-deployment-scopes.mjs

      - name: Check WWW asset size and legacy image URLs
        run: node scripts/check-www-assets.mjs

      - name: Check automation calendar authentication and schedules
        run: pnpm tsx scripts/check-automation-calendar.ts

      - name: Check automation reporting and offline retry
        run: node scripts/check-automation-reporter.mjs

      - name: Typecheck packages/auth
        run: pnpm --filter @petmove/auth exec tsc --noEmit -p .

      - name: Typecheck packages/domain
        run: pnpm --filter @petmove/domain exec tsc --noEmit -p .

      - name: Typecheck packages/ui
        run: pnpm --filter @petmove/ui exec tsc --noEmit -p .

      # 웹 가이드 문구가 앱 판정값(destination-config)과 어긋나면 실패.
      # 사람이 눈으로 훑는 방식으로는 27곳 중 5곳이 어긋난 채 오래 남아 있었다.
      - name: Check www 최소 일령 정합성
        run: pnpm --filter www check:min-age
