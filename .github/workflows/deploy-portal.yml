name: Deploy Portal

# Vercel webhook 의존을 끊기 위해 GitHub Actions 에서 직접 배포한다.
# (Vercel Git 통합은 webhook 끊김이 잦아 신뢰할 수 없음 — apps/portal/CLAUDE.md 노트 참고)
# trigger: master 에 push 되고 portal 빌드에 영향 있는 파일이 변경됐을 때만.

on:
  push:
    branches: [master]
    paths:
      - 'apps/portal/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

concurrency:
  group: deploy-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      # Vercel project 설정에 rootDirectory=apps/portal 가 있어서 CLI 가 자동으로
      # 그 경로로 들어간다. cwd 를 apps/portal 로 잡으면 경로가 중복되니 repo root 에서 실행.

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # vercel pull 은 root 의 .vercel/.env.production.local 만 생성한다. 그런데 next build
      # 가 실행되는 cwd 는 apps/portal(rootDirectory) 라 dotenv 가 그 env 파일을 못 본다.
      # apps/portal/.env.production.local 로 복사해서 next 가 직접 읽게 한다.
      - name: Copy env to portal cwd
        run: cp .vercel/.env.production.local apps/portal/.env.production.local

      # vercel build 가 next build subprocess 에 env 를 자동 전파하지 못하는 패턴이 있어서
      # (monorepo + rootDirectory 조합 때문으로 추정) bash 의 set -a + source 로 직접
      # 현재 shell 환경에 export 한 뒤 build·deploy 를 호출. 같은 shell 안이라 subprocess 가
      # 그대로 상속.
      - name: Build
        shell: bash
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        shell: bash
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
