name: Deploy Portal

# Vercel webhook 의존을 끊기 위해 GitHub Actions 에서 직접 배포한다.
# (Vercel Git 통합은 webhook 끊김이 잦아 신뢰할 수 없음 — apps/portal/CLAUDE.md 노트 참고)
# trigger: master 에 push 되고 portal 빌드에 영향 있는 파일이 변경됐을 때만.

on:
  # 포털 자동 배포 재활성화 (2026-07-14) — 플레이스토어/App Store 심사 완료 후 리디자인
  # 배포 재개. 심사 대비로 잠시 껐던 push 트리거를 원복.
  push:
    branches: [master]
    paths:
      - 'apps/portal/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-portal.yml'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      # vercel pull 로 project.json 만 받아서 prj/org id 인식시키고, 빌드는 Vercel 서버에
      # 위임한다. --prebuilt 없이 vercel deploy --prod 를 하면 vercel CLI 가 source 를
      # zip 으로 업로드 → Vercel 환경에서 빌드 → 배포. webhook 빌드와 동일한 환경·env
      # 처리. GitHub Actions 는 trigger 역할.
      - name: Pull Vercel project metadata
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (build on Vercel)
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
