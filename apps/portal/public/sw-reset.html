<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Petmove Dev Cache</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #212124;
      }

      main {
        width: min(360px, calc(100vw - 32px));
        line-height: 1.5;
      }

      p {
        color: #5c5c60;
      }

      a {
        color: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>캐시를 정리하고 있어요</h1>
      <p id="status">서비스워커와 개발 캐시를 지우는 중입니다.</p>
      <p><a id="login" href="/login">로그인으로 이동</a></p>
    </main>
    <script>
      (async function () {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations()
            await Promise.all(regs.map((reg) => reg.unregister()))
          }
          if ('caches' in window) {
            const keys = await caches.keys()
            await Promise.all(keys.map((key) => caches.delete(key)))
          }
          document.getElementById('status').textContent = '정리 완료. 로그인 화면으로 이동합니다.'
        } catch (error) {
          document.getElementById('status').textContent =
            '자동 정리에 실패했어요. 브라우저의 사이트 데이터를 지운 뒤 다시 시도해주세요.'
        } finally {
          const target = '/login?fresh=' + Date.now()
          document.getElementById('login').setAttribute('href', target)
          setTimeout(function () {
            window.location.replace(target)
          }, 800)
        }
      })()
    </script>
  </body>
</html>
