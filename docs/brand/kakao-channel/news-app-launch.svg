<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63C9FF"/>
      <stop offset="1" stop-color="#0BAEFF"/>
    </linearGradient>
  </defs>

  <!-- 하늘 배경 (브랜드 그라데이션, 아이콘·스플래시와 동일) -->
  <rect width="1080" height="1080" fill="url(#sky)"/>

  <!-- 카피: 스플래시와 같은 Pretendard ExtraBold·흰색·자간 -0.03em -->
  <text x="540" y="300" text-anchor="middle" font-family="Pretendard" font-weight="800"
        font-size="46" letter-spacing="-1.4" fill="#ffffff" opacity="0.9">우리 아이 해외여행</text>
  <text x="540" y="412" text-anchor="middle" font-family="Pretendard" font-weight="800"
        font-size="94" letter-spacing="-2.8" fill="#ffffff">펫무브 앱이 나왔어요</text>

  <!-- 구름 + P (splash-cloud-P.svg 원본, 폭 100%·하단 고정, 비율 유지) -->
  <g transform="translate(0,457) scale(5.4) translate(0,-66)">
    <path d="M116 132 L116 82 A6 6 0 0 1 122 76 L128 76 A15 15 0 0 1 128 106 L118 106" fill="none" stroke="#FFC93C" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="0" y="160" width="200" height="60" fill="#ffffff"/>
    <circle cx="46" cy="168" r="52" fill="#ffffff"/>
    <circle cx="72" cy="120" r="48" fill="#ffffff"/>
    <circle cx="112" cy="148" r="34" fill="#ffffff"/>
    <circle cx="146" cy="138" r="38" fill="#ffffff"/>
    <circle cx="178" cy="154" r="24" fill="#ffffff"/>
    <path d="M116 132 L116 118" fill="none" stroke="#FFC93C" stroke-width="18" stroke-linecap="round" opacity="0.34"/>
  </g>

  <!-- 스토어 안내 (흰 구름 언덕 위, 잉크 그레이) -->
  <text x="540" y="1022" text-anchor="middle" font-family="Pretendard" font-weight="800"
        font-size="36" letter-spacing="-1.1" fill="#3D4854">App Store · Google Play에서 받아보세요</text>
</svg>
