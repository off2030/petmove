<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- sharp/librsvg 가 Pretendard 를 찾게 하는 fontconfig.
     사용법: FONTCONFIG_PATH=<이 파일이 있는 폴더의 절대경로> 로 렌더 실행.
     아래 첫 <dir> 를 각 컴퓨터의 이 폴더 절대경로로 바꿀 것 (Pretendard-ExtraBold.otf 와 같은 폴더). -->
<fontconfig>
  <dir>REPLACE_WITH_ABSOLUTE_PATH_TO_THIS_FOLDER</dir>
  <dir>C:/Windows/Fonts</dir>
  <cachedir>fccache</cachedir>
</fontconfig>
