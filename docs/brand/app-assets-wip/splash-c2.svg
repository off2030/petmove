<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63C9FF"/><stop offset="1" stop-color="#0BAEFF"/>
    </linearGradient>
  </defs>
  <rect width="2732" height="2732" fill="url(#sky)"/>

  <!-- 워드마크: 폰 화면(중앙 스트립) 기준 top 42%, 폭 대비 크기 = C2 비율 그대로 -->
  <text x="1366" y="1248" text-anchor="middle"
        font-family="Pretendard ExtraBold"
        font-size="126" letter-spacing="-3.8" fill="#ffffff">펫무브</text>

  <!-- 하단 흰 바닥(전체 폭) — 구름 라인 아래를 순백으로 -->
  <rect x="0" y="2479" width="2732" height="253" fill="#ffffff"/>

  <!-- C2 구름+P: viewBox 200단위 → 중앙 스트립(폭 1262px, 9:19.5 크롭)에 정확히 매핑 -->
  <g transform="translate(735,1470) scale(6.31)">
    <path d="M116 132 L116 82 A6 6 0 0 1 122 76 L128 76 A15 15 0 0 1 128 106 L118 106"
          fill="none" stroke="#FFC93C" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46" cy="168" r="52" fill="#ffffff"/>
    <circle cx="72" cy="120" r="48" fill="#ffffff"/>
    <circle cx="112" cy="148" r="34" fill="#ffffff"/>
    <circle cx="146" cy="138" r="38" fill="#ffffff"/>
    <circle cx="178" cy="154" r="24" fill="#ffffff"/>
    <path d="M116 132 L116 118" fill="none" stroke="#FFC93C" stroke-width="18" stroke-linecap="round" opacity="0.34"/>
  </g>

  <!-- 양옆 구름 연장 (넓은 기기에서만 보임 — 같은 실루엣 톤으로 이어짐) -->
  <g fill="#ffffff">
    <circle cx="600" cy="2500" r="345"/>
    <circle cx="240" cy="2560" r="320"/>
    <circle cx="2130" cy="2530" r="300"/>
    <circle cx="2480" cy="2570" r="345"/>
  </g>
</svg>
