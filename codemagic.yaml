# Codemagic CI/CD — 펫무브(portal) iOS 클라우드 빌드.
#
# 왜 이렇게 단순한가: portal 은 Capacitor "원격 URL" 방식(capacitor.config.ts server.url =
# app.petmove.co.kr 을 WebView 로 래핑)이라, iOS 빌드가 Next 웹을 다시 빌드할 필요가 없다.
# iOS 앱은 사실상 WebView 셸 + Capacitor 플러그인 묶음이다.
#
# Mac 없이: ios/ 폴더는 레포에 없으므로(생성에 Mac 필요) CI(macOS)에서 매 빌드마다
# `npx cap add ios` 로 생성한다. out/ 도 git 무시라 플레이스홀더를 만든다.
#
# 선행 셋업(Codemagic UI, 1회):
#   - Teams/Personal settings → Integrations → App Store Connect API 키 등록.
#     아래 integrations.app_store_connect 값(petmove_asc)을 그 키 이름과 일치시킬 것.
#   - App ID(com.petmove.portal)에 Sign in with Apple capability — 이미 설정됨(2026-06-26).
#
# 참고 값:
#   - Bundle ID: com.petmove.portal
#   - App Store Apple ID: 6784567864
#   - Team ID: FVFZ724G27

workflows:
  ios-portal:
    name: 펫무브 iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # ⬇️ Codemagic UI 에서 등록한 App Store Connect API 키의 "이름"과 정확히 일치해야 함.
      app_store_connect: petmove_asc

    environment:
      # 코드 서명 = Codemagic 에 저장한 식별자를 직접 지정(수동 모드). 자동 모드
      # (distribution_type)는 인증서 개인키가 Codemagic 저장소에만 있어 Apple API fetch 와
      # 짝을 못 맞춰 "No matching profiles" 였다. Code signing identities 에 저장한
      # 인증서(petmove_dist) + 프로파일(petmove_profile, Apple 에서 생성→Codemagic fetch)을 쓴다.
      ios_signing:
        provisioning_profiles:
          - petmove_profile
        certificates:
          - petmove_dist
      vars:
        BUNDLE_ID: "com.petmove.portal"
        APP_STORE_APPLE_ID: 6784567864
        # 마케팅 버전(App Store 에 보이는 버전). 새 버전 제출 때마다 여기와
        # Android versionName(apps/portal/android/app/build.gradle)을 함께 올린다.
        MARKETING_VERSION: "1.1"
      node: 22 # Capacitor 8 CLI 는 Node >=22 필요(20 이면 cap 명령이 fatal)
      xcode: latest
      cocoapods: default

    scripts:
      - name: 의존성 설치 (pnpm 모노레포)
        script: |
          npm install -g pnpm@10.33.0
          pnpm install --frozen-lockfile

      - name: 웹 자산 플레이스홀더 (원격 URL 방식 — out/ 는 git 무시)
        script: |
          mkdir -p apps/portal/out
          printf '<!doctype html><meta charset="utf-8"><title>펫무브</title>' > apps/portal/out/index.html

      - name: iOS 플랫폼 생성·동기화
        script: |
          cd apps/portal
          npx cap add ios
          # ── 앱 아이콘·스플래시 생성 (Guideline 2.3.8 반려 수정, 2026-07-03) ──
          # `cap add ios` 는 Capacitor 기본 플레이스홀더 아이콘을 넣는다. 실제 펫무브 아이콘
          # (assets/icon.png = 앰버 리본P)을 iOS AppIcon 으로 구워 넣지 않으면 App Review 가
          # "placeholder icon"(2.3.8 Accurate Metadata)으로 반려한다(1.0 빌드20이 이걸로 반려됨).
          # assets/ 의 icon.png·splash*.png 를 읽어 ios/App/App/Assets.xcassets 에 아이콘·스플래시
          # 이미지를 생성한다. --yes = CI 비대화형에서 npx 설치 자동 확인.
          npx --yes @capacitor/assets generate --ios
          npx cap sync ios
          # Capacitor 8 은 CocoaPods 가 아니라 Swift Package Manager(Package.swift) 사용 →
          # Podfile·pod install·.xcworkspace 가 없다. xcodebuild 가 App.xcodeproj 를 직접
          # 빌드하며 SPM 의존성을 자동 resolve 한다.
          # 수출규정: 앱은 표준 HTTPS 만 사용(비면제 암호화 없음) → Info.plist 에 선언해두면
          # TestFlight/심사 제출 때마다 "앱 암호화 문서" 질문이 안 뜬다.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
          # 빌드 번호(CFBundleVersion)를 Codemagic 빌드 카운터로 — TestFlight 는 매 업로드마다
          # 이전보다 높은 빌드 번호를 요구한다(중복이면 "must be higher than previously uploaded" 거부).
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER:-2}" ios/App/App/Info.plist
          # 마케팅 버전(CFBundleShortVersionString) — App Store 에 보이는 버전. cap add ios 기본값이
          # 1.0 고정이라 새 버전 제출 시 environment.vars.MARKETING_VERSION 을 올려야 반영된다.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${MARKETING_VERSION:-1.0}" ios/App/App/Info.plist
          # 구글 로그인 딥링크용 커스텀 URL scheme 등록. 구글은 임베디드 WebView OAuth 를
          # 차단하므로 Custom Tab(외부 브라우저)에서 인증 후 com.petmove.portal://auth/callback
          # 딥링크로 앱에 복귀하는데, iOS 는 안드로이드(Capacitor 가 appId 를 자동 등록)와 달리
          # 이 scheme 을 Info.plist 에 직접 선언해야 라우팅된다. 없으면 인증을 마쳐도 앱으로
          # 못 돌아와 구글 로그인이 멈춘다. (애플·카카오·네이버는 딥링크를 안 써서 영향 없음.)
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.petmove.portal" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.petmove.portal" "$PLIST" 2>/dev/null || true
          # 카메라·사진보관함 사용 설명. 서류·아바타 첨부가 <input type=file accept=image/*> 라
          # iOS 가 "사진 촬영" 옵션을 띄우는데, NSCameraUsageDescription 이 없으면 카메라 접근
          # 순간 앱이 강제 종료된다(권한 거부가 아니라 무조건 크래시 — iOS 규칙). 사진 선택용
          # NSPhotoLibraryUsageDescription 도 함께(방어적). 문구는 사용자 권한 팝업·심사에 노출됨.
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 반려동물 사진과 서류를 촬영해 첨부하기 위해 카메라를 사용합니다." "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 반려동물 사진과 서류를 촬영해 첨부하기 위해 카메라를 사용합니다." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 반려동물 사진과 서류를 선택해 첨부하기 위해 사진 보관함을 사용합니다." "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 반려동물 사진과 서류를 선택해 첨부하기 위해 사진 보관함을 사용합니다." "$PLIST"
          # 사진 보관함 '추가' 권한 — 첨부 이미지를 저장·공유 시트의 "사진에 저장"으로 내보낼 때
          # NSPhotoLibraryAddUsageDescription 이 없으면 저장 순간 앱이 강제 종료된다(읽기용과 별개 키).
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 받은 서류·사진을 기기 사진 보관함에 저장하기 위해 사용합니다." "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 받은 서류·사진을 기기 사진 보관함에 저장하기 위해 사용합니다." "$PLIST"
          # ── 파이어베이스(FCM) 푸시 구성 파일 + 백그라운드 모드 ──
          # GoogleService-Info.plist 를 앱 번들에 복사. ios/ 는 매빌드 생성되므로 레포의
          # apps/portal/firebase/ 에 보관해 두고 여기서 넣는다. 플러그인의 FirebaseApp.configure()
          # 가 번들에서 이 파일을 읽어 FCM 을 초기화한다(비밀 아님=공개 client config).
          cp firebase/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          # 원격 알림 백그라운드 수신 모드.
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST" 2>/dev/null || true

      - name: Sign in with Apple + 푸시 엔타이틀먼트 주입 + FCM plist 등록
        # Capacitor 기본 템플릿엔 엔타이틀먼트 파일이 없다. Apple 로그인이 런타임에 동작하려면
        # 바이너리가 com.apple.developer.applesignin 권한을 선언해야 한다(App ID capability 와 짝).
        # 푸시도 aps-environment 엔타이틀먼트가 필요(App ID Push capability + 재생성 프로파일과 짝).
        script: |
          cd apps/portal/ios/App
          ENT="App/App.entitlements"
          if [ ! -f "$ENT" ]; then
            /usr/libexec/PlistBuddy -c "Save" "$ENT" 2>/dev/null || \
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > "$ENT"
          fi
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" "$ENT" 2>/dev/null || true
          # 푸시(APNs) 엔타이틀먼트 — App Store/TestFlight 빌드라 production.
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT"
          # CODE_SIGN_ENTITLEMENTS 는 App 타깃에만 설정해야 한다. 전역 xcarg 로 주면 SPM
          # 패키지(facebook-ios-sdk 등)도 자기 경로에서 App/App.entitlements 를 찾다 실패한다.
          # → xcodeproj gem 으로 App 타깃 빌드설정에만 연결(gem 최신화로 Xcode 26 포맷 지원).
          # 같은 김에 GoogleService-Info.plist(위 스텝에서 ios/App/App/ 에 복사됨)를 App 타깃
          # 리소스로 등록해 .app 번들에 포함시킨다(없으면 FirebaseApp.configure() 가 못 읽음).
          gem install xcodeproj --no-document 2>/dev/null || true
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("App.xcodeproj")
            t = proj.targets.find { |x| x.name == "App" }
            t.build_configurations.each { |c| c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements" }
            appgrp = proj.main_group["App"] || proj.main_group
            ref = appgrp.files.find { |f| f.path == "GoogleService-Info.plist" } || appgrp.new_reference("GoogleService-Info.plist")
            unless t.resources_build_phase.files_references.include?(ref)
              t.resources_build_phase.add_file_reference(ref)
            end
            proj.save
          '

      - name: 코드 서명 프로파일 적용
        # ios_signing 블록이 저장 인증서 fetch + 프로파일 생성/fetch + 키체인까지 자동 처리.
        # 여기선 받아온 프로파일을 Xcode 프로젝트(App.xcodeproj)에 적용만 한다.
        script: |
          cd apps/portal/ios/App
          xcode-project use-profiles

      - name: SPM 의존성 resolve (+ 진단)
        # Capacitor 8 SPM 프로젝트는 첫 빌드에서 패키지 미해결로 showBuildSettings(exit 74)
        # 가 실패할 수 있다 → 먼저 명시적으로 resolve. xcode-project CLI 가 xcodebuild stderr
        # 를 삼키므로, 여기서 xcodebuild 를 직접 돌려(실패하면) 실제 에러를 로그에 노출한다.
        script: |
          cd apps/portal/ios/App
          ls -la
          xcodebuild -list -project App.xcodeproj || true
          xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies

      - name: IPA 빌드
        # Capacitor 8 = SPM 이라 .xcworkspace 없음 → App.xcodeproj 를 직접 빌드.
        # 엔타이틀먼트는 위 스텝에서 App 타깃 빌드설정에 연결했으므로 여기선 기본값으로 빌드.
        script: |
          cd apps/portal/ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App

    artifacts:
      - apps/portal/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # 업로드만(App Store Connect 에 빌드 등록). submit_to_testflight:true 는 테스터 그룹이
        # 없으면 "App Store distribution" 후처리가 실패(빨강)해 매 빌드가 실패로 보인다 —
        # 업로드는 이미 성공하므로 자동배포는 끄고, TestFlight 테스터 배포·심사는 App Store
        # Connect 에서 수동으로 한다(표준 워크플로).
        submit_to_testflight: false

  # ───────────────────────────────────────────────────────────────────────────
  android-portal:
    name: 펫무브 Android (AAB)
    # Android 도 Gradle 이라 어느 OS 든 빌드 가능. 무료 플랜은 Linux 인스턴스를
    # 지원하지 않아(billing 에러) iOS 와 동일한 mac 인스턴스로 통일.
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # ⬇️ Codemagic UI 에 등록한 Android keystore 의 "reference name" 과 정확히 일치해야 함.
      #   Codemagic → Teams/App settings → Code signing identities → Android keystores →
      #   Generate keystore(또는 Upload) → reference name 을 petmove_upload 로.
      #   생성 후 반드시 Download 해서 안전한 곳에 백업(분실 시 앱 업데이트 서명 불가).
      #   이 블록이 있으면 빌드 중 CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD /
      #   CM_KEY_ALIAS / CM_KEY_PASSWORD 환경변수가 자동 주입된다.
      android_signing:
        - petmove_upload
      vars:
        PACKAGE_NAME: "com.petmove.portal"
      node: 22 # Capacitor 8 CLI 는 Node >=22 필요

    scripts:
      - name: 의존성 설치 (pnpm 모노레포)
        script: |
          npm install -g pnpm@10.33.0
          pnpm install --frozen-lockfile

      - name: 웹 자산 플레이스홀더 (원격 URL 방식 — out/ 는 git 무시)
        script: |
          mkdir -p apps/portal/out
          printf '<!doctype html><meta charset="utf-8"><title>펫무브</title>' > apps/portal/out/index.html

      - name: Android 플랫폼 동기화 + 아이콘·스플래시 생성
        script: |
          cd apps/portal
          npx cap sync android
          # 안드로이드에선 플러그인 런치 스플래시(시스템 아이콘 화면 유지)를 끄고
          # MainActivity 부트 스플래시(풀화면 시안)를 쓴다 — 스크립트 주석 참고.
          node scripts/patch-android-splash-config.mjs
          # cap sync 는 Capacitor 기본 placeholder 아이콘을 넣는다. 실제 펫무브 아이콘
          # (assets/icon.png = 앰버 리본P)을 launcher 아이콘으로 구워넣지 않으면 스토어에
          # placeholder 로 뜬다(iOS 2.3.8 반려와 같은 부류). --yes = 비대화형 자동 설치 확인.
          npx --yes @capacitor/assets generate --android
          # ⚠️ generate 가 adaptive icon XML 을 <inset 16.7%> 형태로 덮어씀 — 배경이 108dp 를
          # 못 채워 삼성 런처에서 검은 모서리(2026-06-25 실기기 확인). 커밋된 no-inset 원본으로 원복.
          git checkout -- android/app/src/main/res/mipmap-anydpi-v26/

      - name: keystore 서명 설정 주입 (key.properties)
        script: |
          # android_signing 블록이 주입한 CM_* 변수로 app/build.gradle 이 읽는 key.properties 생성.
          KP="$CM_BUILD_DIR/apps/portal/android/key.properties"
          {
            echo "storeFile=$CM_KEYSTORE_PATH"
            echo "storePassword=$CM_KEYSTORE_PASSWORD"
            echo "keyAlias=$CM_KEY_ALIAS"
            echo "keyPassword=$CM_KEY_PASSWORD"
          } > "$KP"

      - name: AAB 빌드 (release, 서명)
        script: |
          # Capacitor 8 코어(capacitor-android)는 sourceCompatibility=21 → JDK 21 로 컴파일해야 함.
          # Codemagic mac 기본 JDK 는 17 이라 'invalid source release: 21' 로 실패 → java_home 으로 21 선택.
          export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
          echo "Using JAVA_HOME=$JAVA_HOME"
          java -version
          cd apps/portal/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

    artifacts:
      # 서명된 App Bundle — Codemagic 빌드 결과에서 다운로드해 Play Console 에 업로드.
      - apps/portal/android/app/build/outputs/bundle/**/*.aab

    # 참고: Play Console 자동 업로드(google_play publishing)는 서비스 계정 JSON 설정이 필요해
    # 최초 릴리스에선 생략. AAB 를 수동 업로드해 첫 트랙을 만든 뒤, 원하면 추후 추가한다.
